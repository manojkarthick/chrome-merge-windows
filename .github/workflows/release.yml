name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Opens or updates the release PR; merging it tags the version and creates the GitHub release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          # No dependencies, so there is no lockfile to key a pnpm cache on.
          package-manager-cache: false
      - if: ${{ steps.release.outputs.release_created }}
        run: make package
      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.zip
      # Hands the exact release ZIP to the publish job, which has no repository access.
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-zip
          path: dist/chrome-merge-windows-${{ steps.release.outputs.version }}.zip
          if-no-files-found: error

  # Third-party upload code runs here, isolated from the release job's write token and checkout.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions: {}
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-zip
      # Pinned to an audited commit. Review the dist/index.js diff before bumping it.
      - uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: chrome-merge-windows-${{ needs.release.outputs.version }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
