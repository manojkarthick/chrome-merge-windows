name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Opens or updates the release PR; merging it tags the version and creates the GitHub release.
      - uses: googleapis/release-please-action@v5
        id: release
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
      - if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@v4
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # No dependencies, so there is no lockfile to key a pnpm cache on.
          package-manager-cache: false
      - if: ${{ steps.release.outputs.release_created }}
        run: make package
      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.zip
